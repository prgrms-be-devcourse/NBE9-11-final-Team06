services:
  nginx:
    container_name: gotoday-nginx
    image: nginx:1.27-alpine
    expose:
      - "80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
    restart: unless-stopped

  npm:
    container_name: gotoday-npm
    image: jc21/nginx-proxy-manager:2
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81"
    environment:
      TZ: Asia/Seoul
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - nginx
    restart: unless-stopped

  backend-blue:
    container_name: gotoday-backend-blue
    image: ghcr.io/prgrms-be-devcourse/gotoday-backend:latest
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SEOUL_API_KEY: ${SEOUL_API_KEY:-dummy}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      KMA_WEATHER_API_KEY: ${KMA_WEATHER_API_KEY:-dummy}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  backend-green:
    container_name: gotoday-backend-green
    image: ghcr.io/prgrms-be-devcourse/gotoday-backend:latest
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SEOUL_API_KEY: ${SEOUL_API_KEY:-dummy}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      KMA_WEATHER_API_KEY: ${KMA_WEATHER_API_KEY:-dummy}
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    container_name: gotoday-frontend
    image: ghcr.io/prgrms-be-devcourse/gotoday-frontend:latest
    expose:
      - "3000"
    restart: unless-stopped

  mysql:
    container_name: gotoday-mysql
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
  npm_data:
  npm_letsencrypt: