spring:
  datasource:
    url: jdbc:h2:mem:gotoday-dev
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

external:
  seoul:
    base-url: http://openapi.seoul.go.kr:8088
    api-key: ${SEOUL_API_KEY:dummy}