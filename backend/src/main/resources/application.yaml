spring:
  application:
    name: go-today

  profiles:
    active: dev

  sql:
    init:
      mode: embedded

  jpa:
    open-in-view: false
    defer-datasource-initialization: true # Hibernate가 테이블을 다 만든 '후'에 data.sql이 돌도록 보장한다.

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - profile
              - email

          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:gotoday-local-jwt-secret-key-must-be-at-least-32-bytes}
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

external:
  seoul:
    base-url: http://openapi.seoul.go.kr:8088
    api-key: ${SEOUL_API_KEY:dummy-key}

cors:
  allowed-origins:
    - ${FRONTEND_ORIGIN:http://localhost:3000}

seoul:
  api:
    key: ${SEOUL_API_KEY:dummy-key}

recommendation:
  score:
    crowd:
      relaxed: 100
      normal: 70
      crowded: 40
      very-crowded: 10

naver:
  search:
    client-id: ${NAVER_SEARCH_CLIENT_ID:dummy-client-id}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET:dummy-client-secret}
    base-url: https://openapi.naver.com

app:
  oauth2:
    redirect:
      success-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:3000/oauth/callback}
      failure-url: ${OAUTH2_FAILURE_REDIRECT_URL:http://localhost:3000/login?error=oauth}

crypto:
  secret-key: ${CRYPTO_SECRET_KEY:dummy-key}

toss:
  payment:
    secret-key: ${TOSS_SECRET_KEY:dummy-key}