spring:
  application:
    name: go-today

  profiles:
    active: dev

  config:
    import: optional:classpath:application-secret.yml

  jpa:
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:gotoday-local-jwt-secret-key-must-be-at-least-32-bytes}
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

external:
  seoul:
    base-url: http://openapi.seoul.go.kr:8088
    api-key: ${SEOUL_API_KEY:dummy-key}

cors:
  allowed-origins:
    - ${FRONTEND_ORIGIN:http://localhost:3000}

seoul:
  api:
    key: ${SEOUL_API_KEY:dummy-key}

recommendation:
  score:
    crowd:
      relaxed: 30
      normal: 10
      crowded: -10
      very-crowded: -30