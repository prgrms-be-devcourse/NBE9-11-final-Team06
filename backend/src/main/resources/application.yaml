spring:
  application:
    name: go-today

  profiles:
    active: dev

  jpa:
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - profile
              - email

          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:gotoday-local-jwt-secret-key-must-be-at-least-32-bytes}
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

external:
  seoul:
    base-url: http://openapi.seoul.go.kr:8088
    api-key: ${SEOUL_API_KEY:dummy-key}

cors:
  allowed-origins:
    - ${FRONTEND_ORIGIN:http://localhost:3000}

seoul:
  api:
    key: ${SEOUL_API_KEY:dummy-key}

recommendation:
  score:
    crowd:
      relaxed: 30
      normal: 10
      crowded: -10
      very-crowded: -30

naver:
  search:
    client-id: ${NAVER_SEARCH_CLIENT_ID:dummy-client-id}
    client-secret: ${NAVER_SEARCH_CLIENT_SECRET:dummy-client-secret}
    base-url: https://openapi.naver.com

app:
  oauth2:
    redirect:
      success-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:3000}
      failure-url: ${OAUTH2_FAILURE_REDIRECT_URL:http://localhost:3000/login?error=oauth}