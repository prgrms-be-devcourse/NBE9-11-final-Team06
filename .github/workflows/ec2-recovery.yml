name: EC2 Backend Recovery

on:
  workflow_dispatch:

jobs:
  recover:
    name: Recover Backend Blue
    runs-on: ubuntu-latest

    steps:
      - name: Recover backend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            cd ~/gotoday

            echo "=== Current containers ==="
            docker ps -a

            echo "=== Force cleanup old/green backend ==="
            docker rm -f gotoday-backend || true
            docker rm -f gotoday-backend-green || true

            echo "=== Set upstream to backend-blue ==="
            printf 'upstream backend {\n    server backend-blue:8080;\n}\n' > ./nginx/backend-upstream.conf.inc

            echo "=== Start core services ==="
            docker compose up -d mysql frontend nginx npm

            echo "=== Start backend-blue ==="
            docker compose up -d --no-deps backend-blue

            echo "=== Wait backend-blue health ==="
            for i in {1..36}; do
              if docker exec gotoday-nginx wget -qO- http://backend-blue:8080/actuator/health 2>/dev/null | grep -q "UP"; then
                echo "backend-blue is healthy"
                break
              fi

              if [ "$i" -eq 36 ]; then
                echo "backend-blue health check failed"
                docker logs --tail=150 gotoday-backend-blue || true
                exit 1
              fi

              echo "Waiting for backend-blue..."
              sleep 5
            done

            echo "=== Reload nginx ==="
            docker exec gotoday-nginx nginx -t
            docker exec gotoday-nginx nginx -s reload

            echo "=== Final check ==="
            curl -f https://gotoday.site/actuator/health

            echo "Recovery completed"