name: Backend Docker Build and Push

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'deploy/**'
      - '.github/workflows/backend-docker.yml'

  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'deploy/**'
      - '.github/workflows/backend-docker.yml'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and Push Backend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gotoday-backend" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare EC2 upload directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            rm -rf ~/gotoday-upload
            mkdir -p ~/gotoday-upload
            mkdir -p ~/gotoday/nginx

      - name: Copy deploy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/docker-compose.ec2.yml,deploy/nginx/default.conf"
          target: "~/gotoday-upload"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cp ~/gotoday-upload/deploy/docker-compose.ec2.yml ~/gotoday/docker-compose.yml
            cp ~/gotoday-upload/deploy/nginx/default.conf ~/gotoday/nginx/default.conf
            rm -rf ~/gotoday-upload

            cd ~/gotoday

            docker pull ghcr.io/prgrms-be-devcourse/gotoday-backend:latest
            docker compose down
            docker compose up -d

            for i in {1..12}; do
              if curl -f http://localhost/actuator/health; then
                echo "Health check succeeded"
                exit 0
              fi

              echo "Health check failed. Retrying in 5 seconds..."
              sleep 5
            done

            echo "Health check failed after retries"
            docker compose ps
            docker logs --tail=100 gotoday-backend
            docker logs --tail=100 gotoday-nginx
            exit 1