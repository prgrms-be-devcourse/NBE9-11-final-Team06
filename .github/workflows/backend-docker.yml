name: Backend Docker Build and Push

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'deploy/**'
      - '.github/workflows/backend-docker.yml'

  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'deploy/**'
      - '.github/workflows/backend-docker.yml'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and Push Backend Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gotoday-backend" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare EC2 upload directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            rm -rf ~/gotoday-upload
            mkdir -p ~/gotoday-upload
            mkdir -p ~/gotoday/nginx

      - name: Copy deploy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/docker-compose.ec2.yml,deploy/nginx/default.conf,deploy/nginx/backend-upstream.conf.inc"
          target: "~/gotoday-upload"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cp ~/gotoday-upload/deploy/docker-compose.ec2.yml ~/gotoday/docker-compose.yml
            cp ~/gotoday-upload/deploy/nginx/default.conf ~/gotoday/nginx/default.conf

            # 기존 .conf 파일이 남아 있으면 Nginx가 자동 로드하여 upstream 중복 오류가 발생할 수 있으므로 삭제
            rm -f ~/gotoday/nginx/backend-upstream.conf

            # 최초 배포 시에만 초기 upstream 설정 파일 복사
            if [ ! -f ~/gotoday/nginx/backend-upstream.conf.inc ]; then
              cp ~/gotoday-upload/deploy/nginx/backend-upstream.conf.inc ~/gotoday/nginx/backend-upstream.conf.inc
            fi

            rm -rf ~/gotoday-upload

            cd ~/gotoday

            echo "=== Cleanup unused Docker resources ==="
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true

            docker pull ghcr.io/prgrms-be-devcourse/gotoday-backend:latest
            docker pull ghcr.io/prgrms-be-devcourse/gotoday-frontend:latest || true

            docker compose up -d mysql frontend

            echo "=== Remove legacy single backend container before Blue-Green deployment ==="
            docker rm -f gotoday-backend || true

            if grep -q "backend-blue" ./nginx/backend-upstream.conf.inc; then
              CURRENT="blue"
              NEXT="green"
            else
              CURRENT="green"
              NEXT="blue"
            fi

            echo "Current backend: $CURRENT"
            echo "Next backend: $NEXT"

            if ! docker ps --format '{{.Names}}' | grep -q "^gotoday-backend-$CURRENT$"; then
              echo "Current backend container does not exist. Starting backend-$CURRENT first..."
              docker compose up -d --no-deps backend-$CURRENT
            fi

            if ! docker ps --format '{{.Names}}' | grep -q '^gotoday-nginx$'; then
              docker compose up -d --no-deps nginx
            elif ! docker exec gotoday-nginx test -f /etc/nginx/conf.d/backend-upstream.conf.inc; then
              echo "Recreating nginx to apply backend-upstream.conf.inc mount..."
              docker compose up -d --no-deps --force-recreate nginx
            fi

            docker exec gotoday-nginx nginx -t

            echo "Checking current backend-$CURRENT health..."

            for i in {1..24}; do
              if docker exec gotoday-nginx wget -qO- http://backend-$CURRENT:8080/actuator/health 2>/dev/null | grep -q "UP"; then
                echo "backend-$CURRENT is healthy"
                break
              fi

              if [ "$i" -eq 24 ]; then
                echo "backend-$CURRENT health check failed"
                docker logs --tail=100 gotoday-backend-$CURRENT || true
                exit 1
              fi

              echo "Waiting for backend-$CURRENT..."
              sleep 5
            done

            docker compose up -d --no-deps --force-recreate backend-$NEXT

            echo "Waiting for backend-$NEXT health check..."

            for i in {1..24}; do
              if docker exec gotoday-nginx wget -qO- http://backend-$NEXT:8080/actuator/health 2>/dev/null | grep -q "UP"; then                
                echo "backend-$NEXT health check succeeded"
                break
              fi

              if [ "$i" -eq 24 ]; then
                echo "backend-$NEXT health check failed"
                docker logs --tail=100 gotoday-backend-$NEXT || true
                docker rm -f gotoday-backend-$NEXT || true
                exit 1
              fi

              echo "Health check failed. Retrying in 5 seconds..."
              sleep 5
            done

            printf 'upstream backend {\n    server backend-%s:8080;\n}\n' "$NEXT" > ./nginx/backend-upstream.conf.inc

            docker exec gotoday-nginx nginx -t
            docker exec gotoday-nginx nginx -s reload

            docker rm -f gotoday-backend-$CURRENT || true
            docker rm -f gotoday-backend || true

            docker compose up -d --no-deps npm

            echo "Blue-Green deployment completed. Active backend: $NEXT"

            curl --max-time 20 -f https://gotoday.site/actuator/health
