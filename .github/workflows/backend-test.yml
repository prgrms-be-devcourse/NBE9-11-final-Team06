name: Backend Test

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "dev", "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: gradle

      - name: Grant execute permission for Gradle
        working-directory: ./back/DevC
        run: chmod +x ./gradlew

      - name: Run backend tests
        working-directory: ./back/DevC
        run: ./gradlew test
